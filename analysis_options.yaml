# Static analysis is part of the CI gate: any issue fails the build.
include: package:flutter_lints/flutter.yaml

analyzer:
  # No silent dynamic: implicit casts, untyped generics and inferred-dynamic
  # declarations are errors, so JSON and other untyped data must be checked.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Correctness
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures
    - discarded_futures
    - always_declare_return_types
    - type_annotate_public_apis
    # Consistency and readability
    - directives_ordering
    - prefer_single_quotes
    - prefer_final_locals
    - prefer_final_in_for_each
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - avoid_redundant_argument_values
    # Performance (const widgets are not rebuilt)
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
