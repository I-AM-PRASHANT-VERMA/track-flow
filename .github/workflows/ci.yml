# Merge gate for TrackFlow. Required status checks (branch ruleset on main): quality, build-android, secret-scan, dependency-review.
# All third-party actions are pinned to full commit SHAs (tag shown in the comment); Dependabot proposes updates.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:          # lets a GitHub merge queue run the same checks on the exact commit that will land

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.47.5"   # keep identical to the local toolchain; bump deliberately in its own PR

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Format check
        # TEMPORARY: the code base is not yet dart-format clean (all 15 files differ). The one-shot format commit lands AFTER the
        # fix waves are merged (formatting earlier would conflict with every open branch). That commit must delete the next line.
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Static analysis (any issue fails the build)
        run: flutter analyze --no-pub
      - name: Tests with coverage
        run: flutter test --no-pub --coverage --reporter expanded
      - name: Coverage ratchet (must not drop below tool/coverage_threshold.txt)
        run: dart run tool/coverage_gate.dart coverage/lcov.info tool/coverage_threshold.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

  build-android:
    name: build-android
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Use the runner's JDK 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: App must still compile (debug APK, no signing secrets involved)
        run: flutter build apk --debug --no-pub

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
